<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf0e8"><link rel="icon" href="data:,"><title>留一处，给日常 · D 界面体验台</title><link rel="stylesheet" href="/src/style.css"></head>
<body><main id="app"></main><aside class="demo-tools" aria-label="界面体验台"><div class="demo-heading"><div><span class="eyebrow">D / 界面体验台 · v0.2.0 · wimipet/1</span><h2>一段可重复的日常</h2></div><span>模拟消息与设置 · 无模型 / 无桌面采集</span></div><div class="toolbar"><button id="play">播放</button><button id="step">下一步</button><label>速度 <select id="speed"><option value="2400">1×</option><option value="1200">2×</option><option value="4800">0.5×</option></select></label><button id="replay">从头回放</button><button id="reset">恢复初始场景</button><button id="empty">空场景</button><button id="fail">下次请求失败</button><button id="hold">下次请求等待</button><button id="stop">停止体验</button></div><details><summary>回调记录与复现反馈</summary><p>仅导出操作类型、接收对象、长度、错误码与手填反馈，不自动收集聊天正文或图片。手填内容请勿包含密钥或个人信息，不自动保存到磁盘。</p><pre id="callbacks" tabindex="0"></pre><div class="feedback"><label>预期结果<input id="expected" placeholder="例如：指定林间，提交失败后仍保留草稿"></label><label>实际结果<input id="actual" placeholder="请勿填写密钥或个人信息"></label><button id="export">下载复现记录</button></div></details><p id="demo-status" role="status">固定样例共 7 步：共同包双实例 + 第三角色 → 长消息 → 边缘位置 → 角色移除。图片可用下方自带样例。</p><a download="sample.png" href="/fixtures/sample.png">下载自带 PNG（可拖入输入框）</a> · <a download="sample-garden.svg" href="/fixtures/sample.svg">下载 SVG 类型拒绝样例</a> · <button id="sample">添加自带 PNG 样例</button><p class="footnote">此舞台不是原生桌面窗口；位置、角色、对话与观察设置均来自本地替身。真实 A/B/C 连接与跨窗口效果待联调。</p></aside><script type="module" src="/demo/main.js"></script></body></html>
